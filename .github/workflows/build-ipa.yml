name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ABIHours.xcodeproj \
            -scheme ABIHours \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ABIHours.app Payload/
          zip -qry ABIHours.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ABIHours-ipa
          path: ABIHours.ipa

      # One rolling release, so this link always gets the newest build:
      # https://github.com/mcvindleswebsite/abi-hours/releases/latest/download/ABIHours.ipa
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Newest IPA from main."
          gh release upload latest ABIHours.ipa --clobber
          gh release edit latest --notes "Built $(TZ=America/Los_Angeles date '+%a %b %-d, %-I:%M %p') from ${GITHUB_SHA::7}."
